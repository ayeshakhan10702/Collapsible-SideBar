<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" 
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" 
      crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Collapsible Sidebar</title>
      <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="boxes">
    <div class="bigbox">
        <div class="profile">
        <div class="logob"></div>
        <div class="text">
        <h2>AK Codex</h2>
        <p>Web Developer</p>
        </div>
        </div>
      <i class="fa-solid fa-circle-chevron-right toggleicon"></i>
      <div class="menubar">
         <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search...</span>
        </div>
        <div class="dashboard">
              <i  class="fa-solid fa-house "></i>
              <span>Dashboard</span>
        </div>
        <div class="revenue">
               <i class="fa-solid fa-square-poll-vertical"></i>
               <span>Revenue</span>
        </div>
        <div class="notifications">
             <i class="fa-solid fa-bell"></i> 
             <span>Notifications</span>
        </div>
        <div class="support">
            <i class="fa-solid fa-circle-question"></i> 
             <span>Support</span>
        </div>
        <div class="likes">
            <i class="fa-solid fa-heart"></i>
            <span>Likes</span>
        </div>
        <div class="settings">
             <i class="fa-solid fa-gear"></i>
              <span>Settings</span>
        </div>
      </div>
      <div class="bottom-line"></div>
       <div class="logout">
             <i class="fa-solid fa-right-from-bracket"> </i>
              <span>Logout</span>
        </div>
         <div class="mode">
           <i class="fa-regular fa-moon"></i>
            <span>Dark Mode</span>
            <i class="fa-solid fa-toggle-off "></i>
        </div>
    </div>
    <div class="smallbox">
    <div class="logos"></div>
     
      <i class="fa-solid fa-magnifying-glass searchicon"></i>
        <i  class="fa-solid fa-house dashicon"></i>
        <i class="fa-solid fa-square-poll-vertical revicon"></i>
        <i class="fa-solid fa-bell notificationicon"></i> 
         <i class="fa-solid fa-circle-question supporticon"></i>
        <i class="fa-solid fa-heart likeicon"></i>
            <i class="fa-solid fa-gear settingicon"></i>
         <div class="bottom-line"></div>
         <i class="fa-solid fa-right-from-bracket logouticon"> </i>
         <i class="fa-solid fa-toggle-off modeicon"></i>
    </div>

    </div>

  <script src="script.js"></script>
</body>
</html>
